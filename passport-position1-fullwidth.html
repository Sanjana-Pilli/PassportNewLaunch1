<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Passport Launch — Position 1</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', 'Segoe UI', sans-serif; background: transparent; }

  .passport-banner {
    background: #f7f5f2;
    border-top: 3px solid #A83D72;
    border-bottom: 1px solid #e0dbd4;
    padding: 20px 28px;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 36px;
    align-items: center;
    width: 100%;
  }

  .banner-left {}

  .banner-rule {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 11px;
  }
  .banner-rule-line {
    height: 1px;
    width: 24px;
    background: #A83D72;
  }
  .banner-rule-line-flex {
    height: 1px;
    flex: 1;
    background: #e0dbd4;
  }
  .banner-eyebrow {
    font-size: 8px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #A83D72;
  }

  .banner-headline {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 26px;
    font-weight: 700;
    color: #0d1f2b;
    line-height: 1.15;
    margin-bottom: 8px;
    letter-spacing: -0.3px;
  }
  .banner-headline em {
    font-style: italic;
    color: #A83D72;
  }

  .banner-sub {
    font-size: 11px;
    color: #6a7a86;
    letter-spacing: 0.2px;
  }

  .banner-right {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 16px;
  }

  .countdown {
    display: flex;
    align-items: flex-end;
    gap: 0;
  }
  .countdown-unit {
    text-align: center;
    padding: 0 14px;
    border-right: 1px solid #e0dbd4;
  }
  .countdown-unit:last-child {
    border-right: none;
  }
  .countdown-num {
    font-size: 40px;
    font-weight: 900;
    color: #A83D72;
    line-height: 1;
    letter-spacing: -2px;
    font-variant-numeric: tabular-nums;
  }
  .countdown-lbl {
    font-size: 7px;
    font-weight: 700;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: #A83D72;
    margin-top: 5px;
  }

  .banner-cta {
    background: #A83D72;
    color: #fff;
    border: none;
    border-radius: 4px;
    padding: 10px 22px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 0.3px;
    font-family: 'Inter', sans-serif;
    text-decoration: none;
    display: inline-block;
  }
  .banner-cta:hover { background: #8f3260; }

  @media (max-width: 700px) {
    .passport-banner { grid-template-columns: 1fr; gap: 18px; }
    .banner-right { align-items: flex-start; }
    .countdown-num { font-size: 28px; }
    .banner-headline { font-size: 20px; }
  }
</style>
</head>
<body>

<div class="passport-banner">
  <div class="banner-left">
    <div class="banner-rule">
      <div class="banner-rule-line"></div>
      <span class="banner-eyebrow">Product launch · 28 September 2026</span>
      <div class="banner-rule-line-flex"></div>
    </div>
    <div class="banner-headline">
      New Passport —<br><em>our biggest release ever.</em>
    </div>
    <div class="banner-sub">Reimagined from the ground up for the way you work.</div>
  </div>

  <div class="banner-right">
    <div class="countdown">
      <div class="countdown-unit">
        <div class="countdown-num" id="c-days">00</div>
        <div class="countdown-lbl">Days</div>
      </div>
      <div class="countdown-unit">
        <div class="countdown-num" id="c-hrs">00</div>
        <div class="countdown-lbl">Hrs</div>
      </div>
      <div class="countdown-unit">
        <div class="countdown-num" id="c-min">00</div>
        <div class="countdown-lbl">Min</div>
      </div>
      <div class="countdown-unit">
        <div class="countdown-num" id="c-sec">00</div>
        <div class="countdown-lbl">Sec</div>
      </div>
    </div>
    <a class="banner-cta" href="YOUR_PASSPORT_SITE_URL_HERE" target="_blank">Find out more →</a>
  </div>
</div>

<script>
  function pad(n) { return String(Math.floor(n)).padStart(2, '0'); }
  function tick() {
    var launch = new Date('2026-09-28T09:00:00');
    var diff = Math.max(0, launch - new Date());
    document.getElementById('c-days').textContent = pad(diff / 86400000);
    document.getElementById('c-hrs').textContent  = pad((diff % 86400000) / 3600000);
    document.getElementById('c-min').textContent  = pad((diff % 3600000) / 60000);
    document.getElementById('c-sec').textContent  = pad((diff % 60000) / 1000);
  }
  tick();
  setInterval(tick, 1000);
</script>

</body>
</html>
